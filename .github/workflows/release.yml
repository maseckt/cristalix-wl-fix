name: Automated Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd gnupg

      - name: Import GPG subkey
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          echo "${{ secrets.GPG_SUBKEY_PRIVATE }}" | base64 -d > subkey.gpg

          gpg --batch --import subkey.gpg

          # IMPORTANT: fix trust model
          echo "trust-model always" >> ~/.gnupg/gpg.conf

          # verify key exists
          gpg --list-secret-keys --keyid-format=long

      - name: Package secure source tarball
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          DIR_NAME="cristalix-wl-fix-${VERSION}"

          mkdir -p "../${DIR_NAME}"
          cp -r . "../${DIR_NAME}/"

          cd ..
          tar --exclude='.git*' --exclude='.DS_Store' --exclude='._*' \
              -czf "${DIR_NAME}.tar.gz" "${DIR_NAME}"

          mv "${DIR_NAME}.tar.gz" "${{ github.workspace }}/"

      - name: Build AppImage and compress
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"

          touch "Cristalix-${TAG_NAME}.AppImage"
          zstd -19 "Cristalix-${TAG_NAME}.AppImage" \
            -o "cristalix-wl-fix-${VERSION}.zst"

      - name: Sign release assets with GPG
        env:
          KEY_ID: 015883FEDAF890D8
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"

          for file in \
            "cristalix-wl-fix-${VERSION}.tar.gz" \
            "cristalix-wl-fix-${VERSION}.zst"
          do
            gpg --batch \
                --yes \
                --pinentry-mode loopback \
                --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
                --local-user "$KEY_ID" \
                --detach-sign --armor \
                "$file"
          done

      - name: Generate Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            cristalix-wl-fix-*.tar.gz
            cristalix-wl-fix-*.tar.gz.asc
            cristalix-wl-fix-*.zst
            cristalix-wl-fix-*.zst.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
