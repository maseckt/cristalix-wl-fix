name: Automated Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build AppImage and compress to ZST
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          touch "Cristalix-${TAG_NAME}.AppImage"
          zstd -19 "Cristalix-${TAG_NAME}.AppImage" -o "cristalix-wl-fix-${VERSION}.zst"

      - name: Generate Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            Cristalix-*.AppImage
            cristalix-wl-fix-*.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
